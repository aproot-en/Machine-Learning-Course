{% extends "base.html" %}
{% block title %}ExamChecker{% endblock %}
{% block content %}
<div class="dashboard-hero">
  <img src="/static/img/logoRMUTT.png" alt="RMUTT">
  <h1>ระบบตรวจข้อสอบ ภาควิชาวิศวกรรมคอมพิวเตอร์<br>คณะวิศวกรรมศาสตร์ มทร.ธัญบุรี</h1>
</div>
<div class="grid" id="summary-cards">
  <div class="card"><div>จำนวนข้อสอบทั้งหมด</div><h2 id="stat-exams">-</h2></div>
  <div class="card"><div>จำนวนเฉลยทั้งหมด</div><h2 id="stat-answer-keys">-</h2></div>
</div>


<div id="exams-by-year"></div>
{% endblock %}
{% block scripts %}
<script>
function formatDate(isoString) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return '-';
  return d.toLocaleDateString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function formatTime(isoString) {
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return '-';
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

async function load() {
  const [exams, answerKeyTemplates] = await Promise.all([
    apiFetch('/api/exams'), // all years, no filter
    apiFetch('/api/exams/answer-key-templates'),
  ]);
  document.getElementById('stat-exams').textContent = exams.length;
  document.getElementById('stat-answer-keys').textContent = answerKeyTemplates.length;

  const byYear = {};
  for (const exam of exams) {
    (byYear[exam.year] = byYear[exam.year] || []).push(exam);
  }
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const container = document.getElementById('exams-by-year');
  if (years.length === 0) {
    container.innerHTML = '<div class="card">ยังไม่มีข้อสอบเลย — กด “สร้างข้อสอบใหม่” ด้านซ้ายเพื่อเริ่มต้น</div>';
    return;
  }

  container.innerHTML = years.map(year => `
    <div class="card">
      <h2>ข้อมูลเบื้องต้นของข้อสอบที่ถูกสร้างทั้งหมด <span class="badge ok">${byYear[year].length} ข้อสอบ</span></h2>
      <div class="dashboard-exam-table-scroll ${byYear[year].length > 10 ? 'is-scrollable' : ''}">
        <table>
          <thead><tr><th>ชื่อข้อสอบ</th><th>จำนวนข้อ</th><th>ตัวเลือก</th><th>การดำเนินการ</th><th>วันที่</th><th>เวลา</th></tr></thead>
          <tbody>
            ${byYear[year].map(exam => `
              <tr>
                <td>${escapeHtml(exam.title)}</td>
                <td>${exam.num_questions}</td>
                <td>${escapeHtml(exam.choices)}</td>
                <td>
                  <a href="/exams/${exam.id}/upload">อัปโหลด</a> |
                  <a href="/exams/${exam.id}/review">ตรวจ</a> |
                  <a href="/exams/${exam.id}/results">ผลคะแนน</a> |
                  <a href="#" class="rename-exam-link" data-exam-id="${exam.id}" data-exam-title="${escapeHtml(exam.title)}">เปลี่ยนชื่อ</a> |
                  <a href="#" class="delete-exam-link" data-exam-id="${exam.id}" data-exam-title="${escapeHtml(exam.title)}">ลบ</a>
                </td>
                <td>${formatDate(exam.created_at)}</td>
                <td>${formatTime(exam.created_at)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`).join('');

  // Size each long list from the table's real rendered row heights so the
  // viewport shows exactly the header plus 10 exams, regardless of font,
  // zoom level, or wrapped text. The remaining exams are reached by scrolling.
  container.querySelectorAll('.dashboard-exam-table-scroll.is-scrollable').forEach(scrollArea => {
    const headerHeight = scrollArea.querySelector('thead').getBoundingClientRect().height;
    const visibleRows = [...scrollArea.querySelectorAll('tbody tr')].slice(0, 10);
    const rowsHeight = visibleRows.reduce(
      (total, row) => total + row.getBoundingClientRect().height,
      0,
    );
    scrollArea.style.maxHeight = `${Math.ceil(headerHeight + rowsHeight + 1)}px`;
  });

  container.querySelectorAll('.delete-exam-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      deleteExamFromDashboard(parseInt(link.dataset.examId, 10), link.dataset.examTitle);
    });
  });
  container.querySelectorAll('.rename-exam-link').forEach(link => {
    link.addEventListener('click', async (e) => {
      e.preventDefault();
      const renamed = await renameExam(
        parseInt(link.dataset.examId, 10),
        link.dataset.examTitle,
      );
      if (renamed) load();
    });
  });
}

async function deleteExamFromDashboard(examId, title) {
  if (!confirm(`ลบข้อสอบ "${title}" ทิ้งถาวร? (จะลบเฉลย กระดาษที่อัปโหลด และผลคะแนนทั้งหมดของข้อสอบนี้ด้วย)`)) return;
  await apiFetch(`/api/exams/${examId}`, {method: 'DELETE'});
  load();
  loadSidebarExams();
}

load();
</script>
{% endblock %}
